{% extends 'base.html' %}
{% block title %}{{ title }} | NLAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-gov">
            <div class="card-header">{{ title }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    <button class="btn btn-primary mt-4">Save Landowner</button>
                    <a href="{% url 'land_records:landowner_list' %}" class="btn btn-outline-secondary mt-4">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
