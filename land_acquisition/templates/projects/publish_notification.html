{% extends 'base.html' %}
{% block title %}Publish Notification | NLAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-gov">
            <div class="card-header">Publish Official Acquisition Notification &mdash; {{ project.project_code }}</div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notice Number</label>
                        {{ form.notice_number }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notification Title</label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notice Content</label>
                        {{ form.message }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Official Gazette / PDF Attachment</label>
                        {{ form.attachment }}
                    </div>
                    <button class="btn btn-warning fw-semibold">Publish &amp; Notify Landowners</button>
                    <a href="{% url 'projects:project_detail' project.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
